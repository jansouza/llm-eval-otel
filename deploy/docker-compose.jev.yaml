# The demo stack with the real Jev and the labeled synthetic set instead of the fixed cases:
#   docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.jev.yaml up --build
# Send the set again without restarting the stack, with a new seed: the same seed repeats
# the trace and span IDs, which the service drops as duplicates for 10 minutes.
#   GENERATOR_SEED=2 docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.jev.yaml run --rm span-generator
#
# Jev comes from ../.env (LLM_EVAL_JEV_JUDGE_MODEL, TYPESAFE_API_KEY; see .env.example). The
# variables below replace the demo's and win over the file, so the service exports to the
# compose Collector, runs the four checks on every span, and keeps relevance on the fake
# judge (no OpenAI key needed). Each span is one Jev request with up to four questions: 30
# per run of the set (bank-chatbot is exempt from jev_relevance only).
services:
  llm-eval-otel:
    env_file: ../.env
    environment: !override
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4319
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      LLM_EVAL_EVALUATORS: pii_detection,secret_detection,refusal,system_prompt_leak,output_format,relevance,jev_relevance,jev_refusal,jev_toxicity,jev_prompt_injection
      LLM_EVAL_EXCEPTIONS: '{"bank-chatbot": ["pii_detection", "relevance", "jev_relevance"]}'
      LLM_EVAL_SAMPLE_RATES: relevance=1.0,jev_relevance=1.0,jev_refusal=1.0,jev_toxicity=1.0,jev_prompt_injection=1.0
      LLM_EVAL_LLM_JUDGE_MODEL: fake-judge-1
      LLM_EVAL_LLM_JUDGE_BASE_URL: http://fake-judge:8080/v1
      OPENAI_API_KEY: unused-by-the-fake-judge

  span-generator:
    command: ["--endpoint", "http://otel-collector:4318/v1/traces", "--dataset", "/tools/data/relevance-synthetic.jsonl", "--seed", "${GENERATOR_SEED:-1}"]
